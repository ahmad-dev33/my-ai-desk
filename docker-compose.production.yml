# Adds public TLS certificate resolvers to the base stack.
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
services:
  ngrok:
    profiles: [local-tunnel]
  minio:
    labels:
      traefik.http.routers.minio.tls.certresolver: letsencrypt
  chatwoot-web:
    labels:
      traefik.http.routers.chatwoot.tls.certresolver: letsencrypt
  typebot-builder:
    labels:
      traefik.http.routers.typebot-builder.tls.certresolver: letsencrypt
  typebot-viewer:
    labels:
      traefik.http.routers.typebot-viewer.tls.certresolver: letsencrypt
  keycloak:
    labels:
      traefik.http.routers.keycloak.tls.certresolver: letsencrypt
  control-plane:
    environment:
      PRODUCTION_MODE: "true"
    labels:
      traefik.http.routers.control-plane.tls.certresolver: letsencrypt
      traefik.http.routers.bridge-webhook.tls.certresolver: letsencrypt
  dashboard:
    labels:
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.typebot-sso.tls.certresolver: letsencrypt
      traefik.http.routers.chatwoot-sso.tls.certresolver: letsencrypt
